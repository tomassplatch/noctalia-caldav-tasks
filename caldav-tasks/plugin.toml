id = "tomassplatch/caldav-tasks"
name = "CalDAV Tasks Sync"
version = "0.2.0"
plugin_api = 14
author = "tomassplatch"
license = "MIT"
description = "To-do list synced with a CalDAV task calendar (tested with Nextcloud Tasks)."
icon = "check"
tags = ["tasks", "todo", "caldav", "nextcloud"]
dependencies = ["python3"]

[[setting]]
key = "server"
type = "string"
label_key = "settings.server.label"
default = "https://cloud.example.com"

[[setting]]
key = "username"
type = "string"
label_key = "settings.username.label"

[[setting]]
key = "password"
type = "string"
label_key = "settings.password.label"

[[setting]]
key = "calendar"
type = "string"
label_key = "settings.calendar.label"
default = "personal"

[[setting]]
key = "calendar_url"
type = "string"
label_key = "settings.calendar_url.label"
default = ""

[[setting]]
key = "interval"
type = "int"
label_key = "settings.interval.label"
min = 30
max = 600
default = 120

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 560
